<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tree Builder (Vertical)</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        :root {
            --bg: #1e1e1e;
            --panel: #252526;
            --fg: #d4d4d4;
            --muted: #858585;
            --accent: #0e639c;
            --border: #3c3c3c;
            --line: #6a6a6a;
            --danger: #c14a4a;

            --pulse: #d4d4d4;
            --pulse-glow: rgba(212, 212, 212, 0.28);

            --gap: 90px;
            --space: 28px;
            --del-btn: 22px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 32px;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            max-width: 1100px;
            margin: 0 auto 16px;
            gap: 16px;
        }

        h1 {
            font-size: 16px;
            margin: 0;
            font-weight: 600;
        }

        .toolbar button {
            padding: 5px 10px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .toolbar button:hover {
            border-color: var(--accent);
        }

        .canvas {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            border: 1px dashed var(--border);
            border-radius: 8px;
            overflow-x: auto;
            display: flex;
            justify-content: center;
        }

        .node {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-wrap {
            position: relative;
        }

        .node.has-children>.card-wrap::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            height: var(--space);
            border-left: 1px solid var(--line);
            z-index: 0;
        }

        .card-wrap::before {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--pulse);
            box-shadow: 0 0 0 4px var(--pulse-glow);
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 4;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .card-wrap.pulsing::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .children {
            display: flex;
            gap: var(--gap);
            justify-content: center;
            margin-top: var(--space);
        }

        .child {
            position: relative;
            padding-top: var(--space);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .child::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            height: var(--space);
            border-left: 1px solid var(--line);
            z-index: 0;
        }

        .child::after {
            content: "";
            position: absolute;
            top: 0;
            left: calc(-1 * var(--gap) / 2);
            right: calc(-1 * var(--gap) / 2);
            border-top: 1px solid var(--line);
        }

        .child:first-child::after {
            left: 50%;
        }

        .child:last-child::after {
            right: 50%;
        }

        .child:first-child:last-child::after {
            display: none;
        }

        .stub-hit {
            position: absolute;
            top: 0;
            height: var(--space);
            width: 34px;
            display: flex;
            align-items: center;
            z-index: 3;
            cursor: default;
            border-radius: 4px;
            transition: background 0.12s;
        }

        .stub-hit.left {
            right: calc(50% + 1px);
            justify-content: flex-end;
            padding-right: 5px;
        }

        .stub-hit.right {
            left: calc(50% + 1px);
            justify-content: flex-start;
            padding-left: 5px;
        }

        .stub-hit:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .edge-text {
            background: var(--bg);
            color: var(--fg);
            font-size: 12px;
            line-height: 1;
            padding: 2px 4px;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
        }

        .edge-hint {
            color: var(--muted);
            font-size: 11px;
            line-height: 1;
            padding: 2px 4px;
            background: var(--bg);
            opacity: 0;
            transition: opacity 0.12s;
            pointer-events: none;
        }

        .stub-hit:hover .edge-hint {
            opacity: 0.8;
        }

        .edge-input {
            position: absolute;
            top: calc(var(--space) / 2);
            transform: translateY(-50%);
            width: 110px;
            height: 22px;
            padding: 0 8px;
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            z-index: 4;
            cursor: default;
        }

        .edge-input.left {
            right: calc(50% + 4px);
            text-align: right;
        }

        .edge-input.right {
            left: calc(50% + 4px);
            text-align: left;
        }

        .card {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 5px 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            min-height: 34px;
            font-size: 14px;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.12s;
        }

        .card:hover {
            border-color: var(--line);
        }

        .card.filled {
            border-color: #4a4a4a;
        }

        .card input {
            border: none;
            background: transparent;
            color: var(--fg);
            font: inherit;
            outline: none;
            width: 90px;
            padding: 0 2px;
            text-align: center;
            cursor: default;
        }

        .card input::placeholder {
            color: var(--muted);
        }

        .card .label {
            padding: 0 2px;
            min-width: 90px;
            text-align: center;
            user-select: none;
        }

        .card .placeholder {
            padding: 0 2px;
            min-width: 90px;
            text-align: center;
            color: var(--muted);
            opacity: 0.45;
            user-select: none;
            font-size: 16px;
            line-height: 1;
        }

        .card .del {
            width: var(--del-btn);
            height: var(--del-btn);
            padding: 0;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--fg);
            font-size: 12px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .card .del:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="app">
        <header>
            <h1>Tree Builder</h1>
            <div class="toolbar">
                <button @click="reset">Reset</button>
            </div>
        </header>

        <div class="canvas">
            <tree-node :node="state.root" :is-root="true" @add-child="addChild" @remove="removeNode" />
        </div>
    </div>

    <script>
        const { createApp, reactive, ref, watch, onMounted, onBeforeUnmount, nextTick } = Vue;

        const TreeNode = {
            name: "TreeNode",
            props: {
                node: { type: Object, required: true },
                isRoot: { type: Boolean, default: false }
            },
            emits: ["add-child", "remove"],
            setup(props, { emit }) {
                const draft = ref("");
                const inputEl = ref(null);
                const cardWrapEl = ref(null);
                const editing = ref(false);
                let pendingClick = null;
                let justCommitted = false;

                const edgeEditingId = ref(null);
                const edgeEditingSide = ref(null);
                const edgeDraft = ref("");
                const edgeInput = ref(null);

                const pulsing = ref(false);
                let pulseTimer = null;

                function findChildById(id) {
                    if (id == null) return null;
                    return props.node.children.find(c => c.id === id) || null;
                }

                function onDocMouseDown(e) {
                    if (editing.value && inputEl.value && e.target !== inputEl.value) {
                        const ourWrap = cardWrapEl.value;
                        if (!ourWrap || !ourWrap.contains(e.target)) {
                            commit();
                            justCommitted = true;
                            setTimeout(() => { justCommitted = false; }, 150);
                        }
                    }
                    if (edgeEditingId.value && edgeInput.value && e.target !== edgeInput.value) {
                        const child = findChildById(edgeEditingId.value);
                        if (child) commitEdge(child);
                    }
                }

                /* Auto-enter edit mode whenever a node's autoEdit flag flips on.
                   Uses a watcher (not just onMounted) so that replacing the root
                   on Reset — which doesn't re-mount the component — still triggers it. */
                watch(
                    () => props.node.autoEdit,
                    (val) => {
                        if (val) {
                            props.node.autoEdit = false;
                            nextTick(() => startEdit());
                        }
                    },
                    { immediate: true }
                );

                onMounted(() => {
                    document.addEventListener("mousedown", onDocMouseDown, true);
                });
                onBeforeUnmount(() => {
                    document.removeEventListener("mousedown", onDocMouseDown, true);
                    if (pendingClick) clearTimeout(pendingClick);
                    if (pulseTimer) clearTimeout(pulseTimer);
                });

                function commit() {
                    const v = draft.value.trim();
                    if (v) props.node.value = v;
                    draft.value = "";
                    editing.value = false;
                }
                function cancelEdit() { editing.value = false; draft.value = ""; }
                function startEdit() {
                    draft.value = props.node.value || "";
                    editing.value = true;
                    nextTick(() => inputEl.value && inputEl.value.focus());
                }
                function onBlur() { commit(); }

                function onInputMouseDown(e) {
                    if (e.detail >= 2) e.preventDefault();
                }

                /* SINGLE click → add branch (after a short debounce so double-click can cancel it) */
                function onCardClick() {
                    if (editing.value) {
                        commit();
                        justCommitted = true;
                        setTimeout(() => { justCommitted = false; }, 150);
                        return;
                    }
                    if (justCommitted) return;
                    if (pendingClick) return;
                    pendingClick = setTimeout(() => {
                        pendingClick = null;
                        pulsing.value = true;
                        emit("add-child", props.node.id);
                        clearTimeout(pulseTimer);
                        pulseTimer = setTimeout(() => { pulsing.value = false; }, 600);
                    }, 250);
                }

                /* DOUBLE click → edit */
                function onCardDblClick(e) {
                    if (e && e.preventDefault) e.preventDefault();
                    if (pendingClick) { clearTimeout(pendingClick); pendingClick = null; }
                    if (editing.value) return;
                    startEdit();
                }

                function remove(e) {
                    e.stopPropagation();
                    emit("remove", props.node.id);
                }

                function startEdge(child, side) {
                    edgeEditingId.value = child.id;
                    edgeEditingSide.value = side;
                    edgeDraft.value = child.edgeLabel || "";
                    nextTick(() => edgeInput.value && edgeInput.value.focus());
                }
                function commitEdge(child) {
                    if (!child || edgeEditingId.value !== child.id) return;
                    const v = edgeDraft.value.trim();
                    if (v) {
                        child.edgeLabel = v;
                        child.edgeSide = edgeEditingSide.value;
                    } else {
                        child.edgeLabel = null;
                        child.edgeSide = null;
                    }
                    edgeEditingId.value = null;
                    edgeEditingSide.value = null;
                    edgeDraft.value = "";
                }
                function cancelEdge() {
                    edgeEditingId.value = null;
                    edgeEditingSide.value = null;
                    edgeDraft.value = "";
                }

                return {
                    draft, inputEl, cardWrapEl, editing, pulsing,
                    commit, cancelEdit, startEdit, onBlur, onInputMouseDown,
                    onCardClick, onCardDblClick, remove,
                    edgeEditingId, edgeEditingSide, edgeDraft, edgeInput,
                    startEdge, commitEdge, cancelEdge
                };
            },
            template: `
        <div class="node" :class="{ 'has-children': node.children.length > 0 }">
          <div class="card-wrap" ref="cardWrapEl" :class="{ pulsing }">
            <div
              class="card"
              :class="{ filled: node.value !== null }"
              @click="onCardClick"
              @dblclick="onCardDblClick"
            >
              <input
                v-if="editing"
                ref="inputEl"
                v-model="draft"
                placeholder="value"
                @mousedown="onInputMouseDown"
                @click.stop
                @keyup.enter="commit"
                @keyup.esc="cancelEdit"
                @blur="onBlur"
              />
              <span v-else-if="node.value !== null" class="label">{{ node.value }}</span>
              <span v-else class="placeholder">·</span>

              <button
                v-if="!isRoot"
                class="del"
                @click="remove"
                @dblclick.stop
                title="Remove"
              >✕</button>
            </div>
          </div>

          <div class="children" v-if="node.children.length">
            <div class="child" v-for="child in node.children" :key="child.id">

              <div class="stub-hit left" @click.stop="startEdge(child, 'left')">
                <span
                  v-if="child.edgeLabel && child.edgeSide === 'left'"
                  class="edge-text"
                >{{ child.edgeLabel }}</span>
                <span v-else class="edge-hint">+</span>
              </div>

              <div class="stub-hit right" @click.stop="startEdge(child, 'right')">
                <span
                  v-if="child.edgeLabel && child.edgeSide === 'right'"
                  class="edge-text"
                >{{ child.edgeLabel }}</span>
                <span v-else class="edge-hint">+</span>
              </div>

              <input
                v-if="edgeEditingId === child.id"
                ref="edgeInput"
                class="edge-input"
                :class="edgeEditingSide"
                v-model="edgeDraft"
                placeholder="label"
                @click.stop
                @keyup.enter="commitEdge(child)"
                @keyup.esc="cancelEdge"
                @blur="commitEdge(child)"
              />

              <tree-node
                :node="child"
                @add-child="$emit('add-child', $event)"
                @remove="$emit('remove', $event)"
              />
            </div>
          </div>
        </div>
      `
        };

        const app = createApp({
            components: { TreeNode },
            setup() {
                let nextId = 2;
                const state = reactive({
                    root: { id: 1, value: null, children: [], autoEdit: true }
                });

                function findNode(node, id) {
                    if (node.id === id) return node;
                    for (const c of node.children) {
                        const f = findNode(c, id);
                        if (f) return f;
                    }
                    return null;
                }

                function addChild(parentId) {
                    const parent = findNode(state.root, parentId);
                    if (!parent) return;
                    parent.children.push({
                        id: nextId++,
                        value: null,
                        children: [],
                        edgeLabel: null,
                        edgeSide: null,
                        autoEdit: true
                    });
                }

                function removeNode(id) {
                    const detach = (node) => {
                        const i = node.children.findIndex(c => c.id === id);
                        if (i !== -1) { node.children.splice(i, 1); return true; }
                        return node.children.some(detach);
                    };
                    detach(state.root);
                }

                function reset() {
                    nextId = 2;
                    state.root = { id: 1, value: null, children: [], autoEdit: true };
                }

                return { state, addChild, removeNode, reset };
            }
        });

        app.mount("#app");
    </script>
</body>

</html>
